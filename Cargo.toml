[workspace]
resolver = "2"
members = [
    "crates/dsp-core",
    "crates/studio-dsp",
    "crates/noise-engine",
    "crates/bvc-hush",
    "crates/audio-io",
    "crates/aec",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
